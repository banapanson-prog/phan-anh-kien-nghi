<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hòm Thư Giọng Nói - Ấp Hưng Phú</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background: #f0f2f5; }
    .card { background: white; padding: 20px; border-radius: 16px; border: 2px solid #0d6efd; text-align: center; max-width: 420px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .title { color: #0d6efd; font-size: 19px; font-weight: bold; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #6c757d; margin-bottom: 15px; }
    
    .btn-mic { 
      width: 95px; 
      height: 95px; 
      border-radius: 50%; 
      background: #dc3545; 
      color: white; 
      border: none; 
      font-size: 40px; 
      cursor: pointer; 
      margin: 10px auto; 
      outline: none; 
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(220,53,69,0.4); 
      transition: all 0.2s ease;
    }
    .btn-mic.active { 
      background: #198754 !important; 
      transform: scale(1.08); 
      box-shadow: 0 0 22px rgba(25,135,84,0.7) !important; 
    }
    
    .status { font-weight: bold; font-size: 14px; color: #0d6efd; margin: 12px 0; min-height: 24px; line-height: 1.4; }
    .txt-area { width: 100%; height: 130px; padding: 12px; border: 1px solid #ced4da; border-radius: 8px; font-size: 15px; margin-top: 5px; resize: none; line-height: 1.4; }
    
    .btn-clear { background: #6c757d; color: white; border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; margin-top: 6px; float: right; cursor: pointer; }
    .btn-send { width: 100%; padding: 14px; background: #0d6efd; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; clear: both; }
  </style>
</head>
<body>

<div class="card">
  <div class="title">HÒM THƯ GÓP Ý GIỌNG NÓI</div>
  <div class="sub">Ban Điều hành Ấp Hưng Phú tiếp nhận 24/7</div>

  <button id="btnMic" class="btn-mic" type="button">🎙️</button>
  <div id="txtStatus" class="status">Chạm vào Micro màu đỏ để BẮT ĐẦU nói</div>

  <textarea id="txtResult" class="txt-area" placeholder="Nội dung lời nói sẽ tự động chuyển và NỐI TIẾP thành văn bản ở đây..."></textarea>
  <button type="button" class="btn-clear" onclick="xoaNoiDung()">🗑️ Xóa làm lại</button>

  <button class="btn-send" type="button" onclick="guiPhanAnh()">GỬI PHẢN ÁNH THẲNG VỀ BAN ẤP</button>
</div>

<script>
  let recognition = null;
  let isRecording = false;
  let lastClickTime = 0;
  
  // Biến lưu trữ toàn bộ văn bản đã cố định (chống ghi đè)
  let finalTranscript = '';

  const btnMic = document.getElementById('btnMic');
  const txtStatus = document.getElementById('txtStatus');
  const txtResult = document.getElementById('txtResult');

  // Hàm tự động chuẩn hóa văn bản thông minh (Xóa từ thừa, viết hoa đầu câu)
  function chuanHoaVanBan(text) {
    if (!text) return '';
    
    // Viết hoa chữ cái đầu tiên
    text = text.charAt(0).toUpperCase() + text.slice(1);
    
    // Chuẩn hóa dấu câu khoảng trắng
    text = text.replace(/\s+/g, ' ');
    
    return text;
  }

  function initSpeech() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
      txtStatus.innerText = "❌ Trình duyệt không hỗ trợ! Vui lòng dùng Chrome hoặc Safari.";
      txtStatus.style.color = "#dc3545";
      return false;
    }

    if (!recognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'vi-VN';
      recognition.continuous = true;     // Giữ micro luôn lắng nghe
      recognition.interimResults = true; // Hiển thị câu đang nói tạm thời

      recognition.onstart = function() {
        isRecording = true;
        btnMic.classList.add('active');
        txtStatus.innerText = "🔴 ĐANG NGHE BÀ CON NÓI... (Chạm Micro để DỪNG)";
        txtStatus.style.color = "#198754";
      };

      recognition.onresult = function(event) {
        let interimTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            // Nếu câu đã nói xong -> Nối tiếp vào văn bản chính và thêm dấu chấm
            finalTranscript += transcript.trim() + '. ';
          } else {
            // Câu đang nói dở -> Hiện tạm thời phía sau
            interimTranscript += transcript;
          }
        }

        // Cập nhật lên màn hình: Văn bản cố định + Câu đang nói dở
        const fullText = finalTranscript + interimTranscript;
        txtResult.value = chuanHoaVanBan(fullText);
      };

      recognition.onerror = function(event) {
        if (event.error === 'no-speech') {
          // Khi bà con dừng nói lâu, không coi là lỗi, chỉ giữ trạng thái
          return;
        }
        isRecording = false;
        btnMic.classList.remove('active');
        if (event.error === 'not-allowed') {
          txtStatus.innerText = "❌ Bị chặn Micro! Hãy chọn 'Cho phép' khi trình duyệt hỏi.";
        } else {
          txtStatus.innerText = "Lỗi Micro: " + event.error;
        }
        txtStatus.style.color = "#dc3545";
      };

      recognition.onend = function() {
        // Tự động bật lại Micro nếu người dùng chưa bấm Dừng (giúp nói dài không bị ngắt)
        if (isRecording) {
          try {
            recognition.start();
          } catch(e) {}
        } else {
          btnMic.classList.remove('active');
          if (txtResult.value.trim() !== "") {
            txtStatus.innerText = "✅ Đã ghi xong! Bà con kiểm tra lại chữ và bấm Gửi.";
            txtStatus.style.color = "#0d6efd";
          }
        }
      };
    }
    return true;
  }

  function handleMicToggle(e) {
    if (e) e.preventDefault();
    
    const now = new Date().getTime();
    if (now - lastClickTime < 500) return;
    lastClickTime = now;

    if (!initSpeech()) return;

    if (!isRecording) {
      try {
        // Lấy lại nội dung cũ nếu bà con muốn nói nối tiếp tiếp
        finalTranscript = txtResult.value.trim();
        if (finalTranscript !== '' && !finalTranscript.endsWith('.')) {
          finalTranscript += '. ';
        }
        
        txtStatus.innerText = "Đang mở Micro...";
        txtStatus.style.color = "#0d6efd";
        recognition.start();
      } catch (err) {
        recognition.stop();
        setTimeout(() => { recognition.start(); }, 200);
      }
    } else {
      isRecording = false;
      recognition.stop();
      btnMic.classList.remove('active');
    }
  }

  btnMic.onclick = handleMicToggle;

  function xoaNoiDung() {
    if (confirm("Bà con có muốn xóa hết chữ để nói lại từ đầu không?")) {
      finalTranscript = '';
      txtResult.value = '';
      txtStatus.innerText = "Đã xóa. Chạm vào Micro màu đỏ để BẮT ĐẦU nói lại.";
      txtStatus.style.color = "#0d6efd";
    }
  }

  function guiPhanAnh() {
    const val = txtResult.value.trim();
    if (!val) {
      alert("Chưa có nội dung! Bà con vui lòng chạm nút Micro màu đỏ để nói trước.");
      return;
    }
    alert("Cảm ơn bà con! Phản ánh đã được ghi nhận thành công:\n\n\"" + val + "\"");
    
    // Reset sau khi gửi
    finalTranscript = '';
    txtResult.value = "";
    if (isRecording) {
      isRecording = false;
      recognition.stop();
      btnMic.classList.remove('active');
    }
  }
</script>

</body>
</html>
