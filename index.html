<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hòm Thư Giọng Nói - Ấp Hưng Phú</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 12px; background: #f0f2f5; }
    
    .card { background: white; padding: 20px; border-radius: 16px; border: 2px solid #0d6efd; text-align: center; max-width: 480px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .title { color: #0d6efd; font-size: 20px; font-weight: bold; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #6c757d; margin-bottom: 12px; }
    
    .btn-mic { 
      width: 90px; 
      height: 90px; 
      border-radius: 50%; 
      background: #dc3545; 
      color: white; 
      border: none; 
      font-size: 38px; 
      cursor: pointer; 
      margin: 5px auto; 
      outline: none; 
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(220,53,69,0.4); 
      transition: all 0.2s ease;
    }
    .btn-mic.active { 
      background: #198754 !important; 
      transform: scale(1.08); 
      box-shadow: 0 0 22px rgba(25,135,84,0.7) !important; 
    }
    
    .status { font-weight: bold; font-size: 14px; color: #0d6efd; margin: 10px 0; min-height: 22px; line-height: 1.4; }
    
    .txt-area { 
      width: 100%; 
      height: 220px; 
      padding: 14px; 
      border: 2px solid #ced4da; 
      border-radius: 10px; 
      font-size: 16px; 
      line-height: 1.5; 
      margin-top: 5px; 
      resize: vertical; 
      background-color: #fafafa;
      color: #212529;
    }
    .txt-area:focus { border-color: #0d6efd; outline: none; background-color: #fff; }
    
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    .btn-clear { background: #dc3545; color: white; border: none; border-radius: 6px; padding: 8px 14px; font-size: 13px; font-weight: bold; cursor: pointer; }
    .note-length { font-size: 12px; color: #6c757d; }
    
    .btn-send { width: 100%; padding: 15px; background: #0d6efd; color: white; border: none; border-radius: 10px; font-size: 17px; font-weight: bold; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 10px rgba(13,110,253,0.3); }
  </style>
</head>
<body>

<div class="card">
  <div class="title">HÒM THƯ GÓP Ý GIỌNG NÓI</div>
  <div class="sub">Ban Điều hành Ấp Hưng Phú tiếp nhận 24/7</div>

  <button id="btnMic" class="btn-mic" type="button">🎙️</button>
  <div id="txtStatus" class="status">Chạm vào Micro màu đỏ để BẮT ĐẦU nói</div>

  <textarea id="txtResult" class="txt-area" placeholder="Nội dung trình bày của cử tri sẽ tự động chuyển thành văn bản và hiển thị ở đây..."></textarea>
  
  <div class="toolbar">
    <span id="txtCount" class="note-length">Đã nhập: 0 ký tự</span>
    <button type="button" class="btn-clear" onclick="xoaNoiDung()">🗑️ Xóa làm lại</button>
  </div>

  <button class="btn-send" type="button" onclick="guiPhanAnh()">GỬI PHẢN ÁNH THẲNG VỀ BAN ẤP</button>
</div>

<script>
  // DÁN LINK APPS SCRIPT CỦA BOSS VÀO GIỮA 2 DẤU NGOẶC KÉP Ở DƯỚI:
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxZiyo8xW_q56L59cPztqf9QWhuyBPY6mwKINZ_w0qWCa4f-WaRUntc5OgOnTnIA8jG/exec";

  let recognition = null;
  let isRecording = false;
  let lastClickTime = 0;
  let finalTranscript = '';
  let lastSpeechTime = 0;

  const btnMic = document.getElementById('btnMic');
  const txtStatus = document.getElementById('txtStatus');
  const txtResult = document.getElementById('txtResult');
  const txtCount = document.getElementById('txtCount');

  // HÀM PHÁT GIỌNG NÓI TIẾNG VIỆT
  function phatGiongNoi(text, callback) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'vi-VN';
      utterance.rate = 0.9;

      let hasRunCallback = false;
      const safeCallback = () => {
        if (!hasRunCallback) {
          hasRunCallback = true;
          if (callback) callback();
        }
      };

      utterance.onend = safeCallback;
      utterance.onerror = safeCallback;
      setTimeout(safeCallback, 3500);

      window.speechSynthesis.speak(utterance);
    } else {
      if (callback) callback();
    }
  }

  // BỘ THUẬT TOÁN CHUẨN HÓA VĂN BẢN THÔNG MINH (NGẮT DẤU CHẤM, DẤU PHẨY, VIẾT HOA)
  function chuanHoaVanBanThongMinh(text) {
    if (!text) return '';

    let formatted = text.trim();

    // 1. Chèn dấu phẩy trước các từ nối thông dụng nếu chưa có dấu
    const linkWords = ['nhưng', 'tuy nhiên', 'vì vậy', 'cho nên', 'do đó', 'ngoài ra', 'đồng thời', 'mặc dù'];
    linkWords.forEach(word => {
      const regex = new RegExp(`(?<=[^,.!?\\s])\\s+(${word})\\b`, 'gi');
      formatted = formatted.replace(regex, ', $1');
    });

    // 2. Tự động viết hoa các từ danh từ riêng/hành chính
    const properNouns = {
      'ấp hưng phú': 'Ấp Hưng Phú',
      'ấp': 'Ấp',
      'xã': 'Xã',
      'huyện': 'Huyện',
      'tỉnh': 'Tỉnh',
      'ủy ban': 'Ủy ban',
      'ban điều hành': 'Ban điều hành',
      'cử tri': 'cử tri'
    };
    Object.keys(properNouns).forEach(key => {
      const regex = new RegExp(`\\b${key}\\b`, 'gi');
      formatted = formatted.replace(regex, properNouns[key]);
    });

    // 3. Chuẩn hóa khoảng trắng quanh dấu chấm, dấu phẩy
    formatted = formatted
      .replace(/\s*,\s*/g, ', ')
      .replace(/\s*\.\s*/g, '. ')
      .replace(/\s+/g, ' ');

    // 4. Viết hoa chữ cái đầu tiên sau mỗi dấu chấm và đầu văn bản
    formatted = formatted.replace(/(^\s*|[.!?]\s+)([a-zàáảãạăắằẳẵặâấầẩẫậđèéẻẽẹêếềểễệìíỉĩịòóỏõọôốồổỗộơớờởỡợùúủũụưứừửữựỳýỷỹỵ])/g, 
      function(match, p1, p2) {
        return p1 + p2.toUpperCase();
      }
    );

    return formatted;
  }

  function capNhatDemKyTu() {
    txtCount.innerText = "Đã nhập: " + txtResult.value.length + " ký tự";
  }

  function initSpeech() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
      txtStatus.innerText = "❌ Trình duyệt không hỗ trợ! Vui lòng dùng Chrome hoặc Safari.";
      txtStatus.style.color = "#dc3545";
      return false;
    }

    if (!recognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'vi-VN';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = function() {
        isRecording = true;
        btnMic.classList.add('active');
        txtStatus.innerText = "🔴 ĐANG NGHE CỬ TRI TRÌNH BÀY... (Chạm Micro để DỪNG)";
        txtStatus.style.color = "#198754";
        lastSpeechTime = new Date().getTime();
      };

      recognition.onresult = function(event) {
        const currentTime = new Date().getTime();
        const pauseDuration = (currentTime - lastSpeechTime) / 1000; // Thời gian tạm dừng (giây)
        lastSpeechTime = currentTime;

        let interimTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          let transcript = event.results[i][0].transcript;

          if (event.results[i].isFinal) {
            transcript = transcript.trim();
            
            // Xử lý chèn dấu chấm/phẩy dựa trên khoảng dừng giọng nói
            if (pauseDuration > 2.5 && finalTranscript.length > 0 && !/[.!?]\s*$/.test(finalTranscript)) {
              finalTranscript += '. ';
            } else if (pauseDuration > 1.2 && finalTranscript.length > 0 && !/[,.!?]\s*$/.test(finalTranscript)) {               finalTranscript += ', ';             } else if (finalTranscript.length > 0 && !/\s$/.test(finalTranscript)) {
              finalTranscript += ' ';
            }

            finalTranscript += transcript;
          } else {
            interimTranscript += transcript;
          }
        }

        const fullText = finalTranscript + (interimTranscript ? ' ' + interimTranscript : '');
        txtResult.value = chuanHoaVanBanThongMinh(fullText);
        txtResult.scrollTop = txtResult.scrollHeight;
        capNhatDemKyTu();
      };

      recognition.onerror = function(event) {
        if (event.error === 'no-speech') return;
        isRecording = false;
        btnMic.classList.remove('active');
        if (event.error === 'not-allowed') {
          txtStatus.innerText = "❌ Bị chặn Micro! Hãy chọn 'Cho phép' khi trình duyệt hỏi.";
        } else {
          txtStatus.innerText = "Lỗi Micro: " + event.error;
        }
        txtStatus.style.color = "#dc3545";
      };

      recognition.onend = function() {
        if (isRecording) {
          try { recognition.start(); } catch(e) {}
        } else {
          btnMic.classList.remove('active');
          if (txtResult.value.trim() !== "") {
            txtStatus.innerText = "✅ Đã ghi xong! Quý cử tri kiểm tra nội dung và bấm Gửi.";
            txtStatus.style.color = "#0d6efd";
          }
        }
      };
    }
    return true;
  }

  function handleMicToggle(e) {
    if (e) e.preventDefault();
    
    const now = new Date().getTime();
    if (now - lastClickTime < 500) return;
    lastClickTime = now;

    if (!initSpeech()) return;

    if (!isRecording) {
      txtStatus.innerText = "🔊 Mời quý cử tri phát biểu...";
      txtStatus.style.color = "#0d6efd";

      phatGiongNoi("Mời quý cử tri phát biểu", function() {
        try {
          finalTranscript = txtResult.value.trim();
          recognition.start();
        } catch (err) {
          recognition.stop();
          setTimeout(() => { recognition.start(); }, 200);
        }
      });

    } else {
      isRecording = false;
      recognition.stop();
      btnMic.classList.remove('active');
    }
  }

  btnMic.onclick = handleMicToggle;
  txtResult.oninput = function() {
    finalTranscript = txtResult.value;
    capNhatDemKyTu();
  };

  function xoaNoiDung() {
    if (confirm("Quý cử tri có muốn xóa hết chữ để nói lại từ đầu không?")) {
      finalTranscript = '';
      txtResult.value = '';
      capNhatDemKyTu();
      txtStatus.innerText = "Đã xóa. Chạm vào Micro màu đỏ để BẮT ĐẦU trình bày lại.";
      txtStatus.style.color = "#0d6efd";
    }
  }

  function guiPhanAnh() {
    const val = txtResult.value.trim();
    if (!val) {
      phatGiongNoi("Chưa có nội dung, xin quý cử tri bấm nút micro để nói trước", function() {
        alert("Chưa có nội dung! Quý cử tri vui lòng chạm nút Micro màu đỏ để trình bày trước.");
      });
      return;
    }

    const btnSend = document.querySelector('.btn-send');
    btnSend.disabled = true;
    btnSend.innerText = "⏳ ĐANG GỬI PHẢN ÁNH...";

    if (isRecording) {
      isRecording = false;
      recognition.stop();
      btnMic.classList.remove('active');
    }

    const formData = new URLSearchParams();
    formData.append('content', val);

    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: formData.toString()
    });

    txtStatus.innerText = "✅ Đã gửi phản ánh thành công!";
    txtStatus.style.color = "#198754";

    phatGiongNoi("Chân thành cảm ơn quý cử tri đã gửi phản ánh, kiến nghị", function() {
      alert("Chân thành cảm ơn quý cử tri đã gửi phản ánh, kiến nghị!");
      
      finalTranscript = '';
      txtResult.value = "";
      capNhatDemKyTu();
      btnSend.disabled = false;
      btnSend.innerText = "GỬI PHẢN ÁNH THẲNG VỀ BAN ẤP";
      txtStatus.innerText = "Chạm vào Micro màu đỏ để BẮT ĐẦU nói";
      txtStatus.style.color = "#0d6efd";
    });
  }
</script>

</body>
</html>
