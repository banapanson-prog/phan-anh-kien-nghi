<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hòm Thư Giọng Nói - Ấp Hưng Phú</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background: #f0f2f5; }
    .card { background: white; padding: 20px; border-radius: 16px; border: 2px solid #0d6efd; text-align: center; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .title { color: #0d6efd; font-size: 19px; font-weight: bold; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #6c757d; margin-bottom: 15px; }
    
    .btn-mic { 
      width: 100px; 
      height: 100px; 
      border-radius: 50%; 
      background: #dc3545; 
      color: white; 
      border: none; 
      font-size: 42px; 
      cursor: pointer; 
      margin: 10px auto; 
      outline: none; 
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(220,53,69,0.4); 
      transition: all 0.2s ease;
    }
    .btn-mic.active { 
      background: #198754 !important; 
      transform: scale(1.08); 
      box-shadow: 0 0 22px rgba(25,135,84,0.7) !important; 
    }
    
    .status { font-weight: bold; font-size: 14px; color: #0d6efd; margin: 12px 0; min-height: 24px; line-height: 1.4; }
    .txt-area { width: 100%; height: 110px; padding: 10px; border: 1px solid #ced4da; border-radius: 8px; font-size: 15px; margin-top: 10px; resize: none; }
    .btn-send { width: 100%; padding: 14px; background: #0d6efd; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 12px; }
  </style>
</head>
<body>

<div class="card">
  <div class="title">HÒM THƯ GÓP Ý GIỌNG NÓI</div>
  <div class="sub">Ban Điều hành Ấp Hưng Phú tiếp nhận 24/7</div>

  <button id="btnMic" class="btn-mic" type="button">🎙️</button>
  <div id="txtStatus" class="status">Chạm vào Micro màu đỏ để BẮT ĐẦU nói</div>

  <textarea id="txtResult" class="txt-area" placeholder="Nội dung lời nói sẽ tự động chuyển thành chữ ở đây..."></textarea>

  <button class="btn-send" type="button" onclick="guiPhanAnh()">GỬI PHẢN ÁNH THẲNG VỀ BAN ẤP</button>
</div>

<script>
  let recognition = null;
  let isRecording = false;
  let lastClickTime = 0; // Biến chống click đúp

  const btnMic = document.getElementById('btnMic');
  const txtStatus = document.getElementById('txtStatus');
  const txtResult = document.getElementById('txtResult');

  function initSpeech() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
      txtStatus.innerText = "❌ Trình duyệt không hỗ trợ! Vui lòng dùng Chrome hoặc Safari.";
      txtStatus.style.color = "#dc3545";
      return false;
    }

    if (!recognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'vi-VN';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = function() {
        isRecording = true;
        btnMic.classList.add('active');
        txtStatus.innerText = "🔴 ĐANG NGHE BÀ CON NÓI... (Chạm Micro để DỪNG)";
        txtStatus.style.color = "#198754";
      };

      recognition.onresult = function(event) {
        let text = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          text += event.results[i][0].transcript;
        }
        if (text.trim() !== "") {
          txtResult.value = text;
        }
      };

      recognition.onerror = function(event) {
        isRecording = false;
        btnMic.classList.remove('active');
        if (event.error === 'not-allowed') {
          txtStatus.innerText = "❌ Bị chặn Micro! Hãy chọn 'Cho phép' khi trình duyệt hỏi.";
        } else if (event.error === 'no-speech') {
          txtStatus.innerText = "Chưa nghe rõ giọng nói. Bà con vui lòng chạm lại Micro để nói.";
        } else {
          txtStatus.innerText = "Lỗi Micro: " + event.error;
        }
        txtStatus.style.color = "#dc3545";
      };

      recognition.onend = function() {
        // Chỉ hiển thị đã xong khi người dùng chủ động tắt
        if (!isRecording) {
          btnMic.classList.remove('active');
          if (txtResult.value.trim() !== "") {
            txtStatus.innerText = "✅ Đã ghi xong! Kiểm tra lại chữ và bấm Gửi.";
            txtStatus.style.color = "#0d6efd";
          } else {
            txtStatus.innerText = "Chưa nhận diện được giọng nói. Vui lòng bấm Micro nói lại.";
            txtStatus.style.color = "#dc3545";
          }
        }
      };
    }
    return true;
  }

  function handleMicToggle(e) {
    if (e) e.preventDefault();
    
    // Chống kích hoạt đúp trong vòng 500ms
    const now = new Date().getTime();
    if (now - lastClickTime < 500) return;
    lastClickTime = now;

    if (!initSpeech()) return;

    if (!isRecording) {
      try {
        txtStatus.innerText = "Đang mở Micro...";
        txtStatus.style.color = "#0d6efd";
        recognition.start();
      } catch (err) {
        // Nếu trình duyệt đang bận, thử ngắt và bật lại
        recognition.stop();
        setTimeout(() => { recognition.start(); }, 200);
      }
    } else {
      isRecording = false;
      recognition.stop();
      btnMic.classList.remove('active');
    }
  }

  // Chỉ gắn 1 sự kiện onclick duy nhất để tránh bị xung đột sự kiện cảm ứng
  btnMic.onclick = handleMicToggle;

  function guiPhanAnh() {
    const val = txtResult.value.trim();
    if (!val) {
      alert("Chưa có nội dung! Bà con vui lòng chạm nút Micro màu đỏ để nói trước.");
      return;
    }
    alert("Cảm ơn bà con! Phản ánh đã được ghi nhận thành công:\n\n\"" + val + "\"");
    txtResult.value = "";
    if (isRecording) {
      isRecording = false;
      recognition.stop();
      btnMic.classList.remove('active');
    }
  }
</script>

</body>
</html>
